{% extends 'base.html' %}

{% block page_title %}Profile - Worship Manager{% endblock %}

{% block extra_css %}
<style>
    .team {
        text-align: center;
        padding: var(--spacing-lg);
        max-width: 400px;
        margin: var(--spacing-xl) auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--spacing-sm); 
    }

    .team select {
        width: 100%;
    }

    .team button {
        width: 100%;
    }
</style>
{% endblock %}

{% block content %}
<div class="team">
    I am: <select id="user"></select>
    <button id="ok_btn" class="btn btn-primary">OK</button>
</div>
{% endblock %}

{% block extra_js %}
<script>
    team = {{ team|safe }};
    html = '';

    // If no users exist, show a clear placeholder and disable the OK button
    if (!team || team.length === 0) {
        $('#user').append('<option value="">No users available</option>');
        $('#ok_btn').prop('disabled', true).css({ opacity: 0.5, cursor: 'not-allowed' });
    } else {
        for (let x = 0; x < team.length; x++) {
            const u = team[x];
            if ($.cookie("user_id") == u.id) {
                html += '<option selected value="' + u.id + '">' + u.name + ' (' + u.name_2 + ')</option>';
            } else {
                html += '<option value="' + u.id + '">' + u.name + ' (' + u.name_2 + ')</option>';
            }
        }
        $('#user').append(html);
        // Ensure OK is enabled when there are users
        $('#ok_btn').prop('disabled', false).css({ opacity: 1, cursor: 'pointer' });
    }

    $('#ok_btn').click(function() {
        if ($(this).prop('disabled')) return false;
        user_id = $('#user').val();
        console.log(user_id);
        user_name = $('#user :selected').text();
        if(confirm('Are you sure you are ' + user_name + '?')) {
            $.cookie("user_id", user_id, { path: '/', expires: 365 });
            $.cookie("user_name", user_name, { path: '/', expires: 365 });
            location.href= '/';
        }
        return true;
    });
</script>
{% endblock %}
