{% extends 'base.html' %}

{% block page_title %}Admin Home{% endblock %}

{% block extra_css %}
    <link href="/static/css/home.css" rel="stylesheet">
{% endblock %}

{% block content %}
    <div class="menu-container">
        <a href="/slides/admin" class="menu-card">
            <i class="fa-solid fa-circle-info"></i>
            <span>Admin</span>
        </a>

        <a href="/slides/lead" class="menu-card">
            <i class="fa-solid fa-users"></i>
            <span>Lead</span>
        </a>

        <!-- EXPERIMENTAL LEAD START: Remove this card when promoting the experimental controller. -->
        <a href="/slides/lead-experimental" class="menu-card">
            <i class="fa-solid fa-flask"></i>
            <span>Lead (Experimental)</span>
        </a>
        <!-- EXPERIMENTAL LEAD END -->

        <a href="/slides/view" class="menu-card">
            <i class="fa-solid fa-eye"></i>
            <span>View</span>
        </a>

        <a href="/slides/musician" class="menu-card">
            <i class="fa-solid fa-music"></i>
            <span>Musician</span>
        </a>

        <a href="/slides/sheets" class="menu-card">
            <i class="fa-solid fa-file-alt"></i>
            <span>Sheets</span>
        </a>

        <a href="/slides/chords" class="menu-card">
            <i class="fa-solid fa-guitar"></i>
            <span>Chords</span>
        </a>

        <button type="button" class="menu-card" id="reset-slides">
            <i class="fa-solid fa-rotate"></i>
            <span>Reset</span>
        </button>
    </div>
{% endblock %}

{% block extra_js %}
    <!-- SLIDE RESET HANDLER START -->
    <script>
        document.getElementById('reset-slides').addEventListener('click', async function() {
            if (!window.confirm('Reset slide data and release all controller locks? Connected displays may need to reload.')) {
                return;
            }

            try {
                const response = await fetch('/slides/admin1');
                if (!response.ok) {
                    throw new Error('Reset request failed.');
                }
                window.location.reload();
            } catch (error) {
                window.alert(error.message);
            }
        });
    </script>
    <!-- SLIDE RESET HANDLER END -->
{% endblock %}
