<!DOCTYPE html>
<html>
<head>
    <script src="/static/vendor/jquery/jquery.js"></script>
    <script src="/static/vendor/jquery/jquery-ui.js"></script>
    <script src="/static/vendor/socket.io/socket.io.js"></script>
    <script src="/static/js/worship.js"></script>
    <script src="/static/js/presentation.js"></script>
    <link href="/static/css/presentation.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/vendor/jquery/jquery-ui.css">
    <link rel="stylesheet" href="/static/vendor/reveal/reset.css">
    <link rel="stylesheet" href="/static/vendor/reveal/reveal.css">
    <link rel="stylesheet" href="/static/vendor/reveal/theme/black.css">
    <script src="/static/vendor/reveal/reveal.js"></script>

    <style>
        body {
            background-color: #000;
            margin: 0;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }

        .lead_container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 290px;
            grid-template-rows: minmax(0, 1fr);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            padding: 15px;
            box-sizing: border-box;
            gap: 12px;
        }

        .lead-sidebar {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        .sidebar-tabs {
            display: flex;
            gap: 6px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .sidebar-tab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            min-height: 40px;
            padding: 8px 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #171717;
            color: #aaa;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .sidebar-tab[aria-selected="true"] {
            border-color: #008080;
            background: #202727;
            color: #00ffcc;
        }

        .tab-icon {
            display: inline-flex;
            flex: 0 0 16px;
        }

        .sequence-icon {
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .sequence-icon span {
            height: 2px;
            background: currentColor;
        }

        .sequence-icon span:nth-child(1) { width: 9px; }
        .sequence-icon span:nth-child(2) { width: 13px; }
        .sequence-icon span:nth-child(3) { width: 16px; }

        .controls-icon {
            flex-direction: column;
            justify-content: space-between;
            height: 14px;
        }

        .controls-icon span {
            position: relative;
            width: 16px;
            height: 2px;
            background: currentColor;
        }

        .controls-icon span::after {
            position: absolute;
            top: -2px;
            left: 4px;
            width: 4px;
            height: 4px;
            border: 1px solid currentColor;
            border-radius: 50%;
            background: #171717;
            content: "";
        }

        .controls-icon span:nth-child(2)::after { left: 10px; }

        .sidebar-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            padding-top: 10px;
        }

        .sidebar-panel[hidden] {
            display: none;
        }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-content: start;
            gap: 10px;
        }

        .admin-btn {
            background-color: #1a1a1a;
            color: #ccc;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 18px 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }

        .admin-btn:hover {
            background-color: #333;
            color: #fff;
            border-color: #008080;
        }

        .admin-btn:active {
            transform: scale(0.95);
            background-color: #004040;
            border-color: #00ffcc;
            color: #00ffcc;
        }

        /* --- Main Presentation Area --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
        }

        .section-navigation {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 48px;
            margin-bottom: 10px;
        }

        .section-neighbor {
            min-width: 0;
            color: #888;
            font-size: 0.8rem;
        }

        .section-neighbor.next {
            text-align: right;
            opacity: 1;
        }

        .section-direction {
            display: block;
            margin-bottom: 2px;
            color: #666;
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .section-neighbor-title {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .section-current {
            min-width: 0;
            text-align: center;
        }

        .section-current-title {
            margin: 0;
            color: #00ffcc;
            font-size: 1.15rem;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .reveal-wrapper {
            width: 100%;
            max-width: 90vw;
            max-height: 80vh;
            aspect-ratio: 16 / 9;
            position: relative;
            background: #111;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .reveal {
            width: 100%;
            height: 100%;
        }

        #slide_notes {
            margin: 20px auto 0 auto;
            width: 75%;
            color: #fff;
            word-wrap: break-word;
            text-align: center;
            font-size: 1.2rem;
            min-height: 30px;
        }

        .preview {
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            padding-right: 10px;
            position: relative;
        }

        .preview-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .preview-wrapper:hover {
            opacity: 0.9;
        }

        .preview-wrapper.present {
            opacity: 1;
        }

        .preview_name {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 1px;
            width: 100%;
            text-align: center;
            transition: color 0.2s ease;
        }

        .preview-wrapper.present .preview_name {
            color: #00ffcc;
            font-weight: bold;
        }

        .preview .inner {
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
            position: relative;
            width: 260px;
            height: 146px;
            overflow: hidden;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .preview-wrapper.present .inner {
            border-color: #00ffcc;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
        }

        /* Scaled Replica CSS - Restores Reveal CSS Context */
        .mini-reveal-wrapper {
            width: 1280px;
            height: 720px;
            transform: scale(0.2031);
            transform-origin: top left;
            pointer-events: none;
            background: transparent !important;
        }

        .mini-reveal-wrapper .slides {
            width: 100% !important;
            height: 100% !important;
            left: 0 !important;
            top: 0 !important;
            margin: 0 !important;
            transform: none !important;
            display: flex !important;
            justify-content: center;
            align-items: center;
        }

        .mini-reveal-wrapper .slides section {
            display: block !important;
            position: relative !important;
            top: auto !important;
            left: auto !important;
            transform: none !important;
            opacity: 1 !important;
        }

        @media (max-width: 1100px) {
            .lead_container {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) 190px;
                gap: 8px;
            }

            .main-content {
                grid-row: 1;
                display: grid;
                grid-template-rows: auto minmax(0, 1fr) auto;
                align-items: center;
                justify-items: center;
            }

            .reveal-wrapper {
                width: auto;
                height: auto;
                max-width: 90vw;
                max-height: 100%;
            }

            #slide_notes {
                margin-top: 8px;
                min-height: 24px;
            }

            .lead-sidebar {
                grid-row: 2;
            }

            .sidebar-tabs { padding-bottom: 6px; }

            .sidebar-panel { padding-top: 6px; }

            .control-panel {
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 8px;
            }

            .admin-btn {
                padding: 12px 6px;
                font-size: 0.75rem;
            }

            .preview {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                padding-right: 0;
                padding-bottom: 6px;
            }

            .preview-wrapper {
                flex: 0 0 200px;
            }

            .preview .inner {
                width: 200px;
                height: 112px;
            }

            .mini-reveal-wrapper {
                transform: scale(0.15625);
            }
        }

        @media (max-width: 600px) {
            .section-navigation {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr);
                gap: 6px;
                min-height: 42px;
                margin-bottom: 6px;
            }

            .section-neighbor {
                font-size: 0.7rem;
            }

            .section-current-title {
                font-size: 1rem;
            }

            .lead_container {
                grid-template-rows: minmax(0, 1fr) 170px;
                padding: 8px;
                gap: 6px;
            }

            .control-panel {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 6px;
            }

            .admin-btn {
                padding: 8px 4px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="lead_container">

        <!-- Main Slide View -->
        <div class="main-content">
            <div class="section-navigation" aria-live="polite">
                <div class="section-neighbor previous">
                    <span class="section-direction">Previous</span>
                    <span class="section-neighbor-title" id="previous-section-title"></span>
                </div>
                <div class="section-current">
                    <h1 class="section-current-title" id="current-section-title"></h1>
                </div>
                <div class="section-neighbor next">
                    <span class="section-direction">Next</span>
                    <span class="section-neighbor-title" id="next-section-title"></span>
                </div>
            </div>
            <div class="reveal-wrapper">
                <div class="reveal">
                    <div class="slides"></div>
                </div>
            </div>
            <div id="slide_notes"></div>
        </div>

        <aside class="lead-sidebar">
            <div class="sidebar-tabs" role="tablist" aria-label="Lead controls">
                <button class="sidebar-tab" id="sequence-tab" type="button" role="tab" aria-selected="true" aria-controls="sequence-panel" tabindex="0">
                    <span class="tab-icon sequence-icon" aria-hidden="true"><span></span><span></span><span></span></span>
                    Sequence
                </button>
                <button class="sidebar-tab" id="controls-tab" type="button" role="tab" aria-selected="false" aria-controls="controls-panel" tabindex="0">
                    <span class="tab-icon controls-icon" aria-hidden="true"><span></span><span></span><span></span></span>
                    Controls
                </button>
            </div>
            <section class="sidebar-panel" id="sequence-panel" role="tabpanel" aria-labelledby="sequence-tab">
                <div class="preview"></div>
            </section>
            <section class="sidebar-panel" id="controls-panel" role="tabpanel" aria-labelledby="controls-tab" hidden>
                <div class="control-panel">
                    <button class="admin-btn" data-action="blank">Blank</button>
                    <button class="admin-btn" data-action="logo">Logo</button>
                    <button class="admin-btn" data-action="alert">Alert</button>
                    <button class="admin-btn" data-action="reload">Reload</button>
                    <button class="admin-btn" data-action="sync">Sync</button>
                </div>
            </section>
        </aside>
    </div>

<script>
    mode = 'lead';                 // Set mode to lead
    presentation = {{ presentation|tojson }};
    slides = presentation['data'];

    var setting = presentation['setting'];

    pos = presentation['pos'][0];
    order = presentation['pos'][1];
    background = presentation['background'];
    w_id = presentation['id'];

    var focus_div = null;
    slide_refreshed = false;

    function update_section_navigation() {
        if (!slides.length) { return; }

        var previousTitle = document.getElementById('previous-section-title');
        var currentTitle = document.getElementById('current-section-title');
        var nextTitle = document.getElementById('next-section-title');
        if (!previousTitle || !currentTitle || !nextTitle) { return; }

        var currentIndex = Math.max(0, Math.min(Number(pos) || 0, slides.length - 1));
        var previousIndex = (currentIndex - 1 + slides.length) % slides.length;
        var nextIndex = (currentIndex + 1) % slides.length;
        var title = function(index) {
            return slides[index].title || 'Untitled section';
        };

        previousTitle.textContent = title(previousIndex);
        currentTitle.textContent = title(currentIndex);
        nextTitle.textContent = title(nextIndex);
    }

    function fit_reveal_wrapper() {
        var mainContent = document.querySelector('.main-content');
        var revealWrapper = document.querySelector('.reveal-wrapper');
        if (!mainContent || !revealWrapper) { return; }

        if (!window.matchMedia('(max-width: 1100px)').matches) {
            revealWrapper.style.removeProperty('width');
            revealWrapper.style.removeProperty('height');
            return;
        }

        var navigation = document.querySelector('.section-navigation');
        var notes = document.getElementById('slide_notes');
        var navigationMargin = parseFloat(window.getComputedStyle(navigation).marginBottom) || 0;
        var notesStyle = window.getComputedStyle(notes);
        var notesMargin = (parseFloat(notesStyle.marginTop) || 0) + (parseFloat(notesStyle.marginBottom) || 0);
        var availableHeight = mainContent.clientHeight - navigation.offsetHeight - navigationMargin - notes.offsetHeight - notesMargin;
        var availableWidth = Math.min(mainContent.clientWidth, window.innerWidth * 0.9);
        var height = Math.max(0, Math.min(availableHeight, availableWidth * 9 / 16));

        revealWrapper.style.width = (height * 16 / 9) + 'px';
        revealWrapper.style.height = height + 'px';
    }

    document.addEventListener('presentation:slides-loaded', function() {
        update_section_navigation();
        window.requestAnimationFrame(fit_reveal_wrapper);
    });

    function scroll_preview_to_current() {
        var currentElement = document.querySelector('.preview-wrapper[data-order="' + order + '"]');
        var previewContainer = document.querySelector('.preview');

        if (!currentElement || !previewContainer) { return; }

        if (window.matchMedia('(max-width: 1100px)').matches) {
            previewContainer.scrollTo({ left: currentElement.offsetLeft, behavior: 'smooth' });
        } else {
            previewContainer.scrollTo({ top: currentElement.offsetTop, behavior: 'smooth' });
        }
    }

    function load_preview() {
        var slide_preview = '';
        var horizontalSlide = Reveal.getSlide(pos, 0);
        var previousName = null;
        var sameNameCount = 0;

        if(!horizontalSlide) {
            $('.preview').empty();
            return true;
        }

        for(var i=0; i<99; i++) {
            var r = Reveal.getSlide(pos, i);
            if(typeof r === 'undefined' || r == null || !r) { break; }
            if(i > 0 && r === Reveal.getSlide(pos, i - 1)) { break; }

            var sectionName = $(r).children().attr('name');
            if (sectionName) {
                sameNameCount = sectionName === previousName ? sameNameCount + 1 : 1;
                previousName = sectionName;
            } else {
                previousName = null;
                sameNameCount = 0;
            }
            var temp_name = sectionName ? sectionName + '.' + sameNameCount : "Slide " + (i + 1);
            var isPresent = r.classList.contains('present') ? 'present' : '';

            var miniContent = '<div class="reveal mini-reveal-wrapper"><div class="slides">' + r.outerHTML + '</div></div>';

            slide_preview += '<div class="preview-wrapper ' + isPresent + '" id="slide-preview-' + i + '" data-order="' + i + '">' +
                                '<div class="preview_name">' + temp_name + '</div>' +
                                '<div class="inner">' + miniContent + '</div>' +
                             '</div>';
        }

        $('.preview').html(slide_preview);

        var previewOrder = order;
        window.requestAnimationFrame(function() {
            if (previewOrder !== order) { return; }
            scroll_preview_to_current();
        });
    }

    $(document).ready(function() {
        Reveal.initialize({
            embedded: true,
            loop: true,
            hash: false,
            slideNumber: true,
            progress: true,
            width: 1280,
            height: 720,
            margin: 0.04
        });

        load_slides();
        fit_reveal_wrapper();
    });

    $(document).on('click', '.preview-wrapper', function (event) {
        event.preventDefault();
        event.stopPropagation();

        var slideOrder = Number($(this).attr('data-order'));
        if (!Number.isInteger(slideOrder) || slideOrder < 0) { return; }

        order = slideOrder;
        Reveal.slide(pos, slideOrder);
        show_data(pos);
    });

    function activate_sidebar_tab(tab) {
        $('.sidebar-tab').attr('aria-selected', 'false').attr('tabindex', '-1');
        $('.sidebar-panel').prop('hidden', true);

        tab.attr('aria-selected', 'true').attr('tabindex', '0');
        $('#' + tab.attr('aria-controls')).prop('hidden', false);

    }

    $(document).on('click', '.sidebar-tab', function () {
        activate_sidebar_tab($(this));
        if (this.id === 'sequence-tab') {
            window.requestAnimationFrame(scroll_preview_to_current);
        }
    });

    window.addEventListener('resize', function() {
        window.requestAnimationFrame(function() {
            scroll_preview_to_current();
            fit_reveal_wrapper();
        });
    });

    $(document).on('click', '.admin-btn', function() {
        var actionType = $(this).data('action');
        console.log("Admin action triggered:", actionType);

        socket.emit('control', {
            'type': 'admin_command',
            'action': actionType,
            'from': 'lead'
        });

        var btn = $(this);
        var originalText = btn.text();
        btn.text('Sent!');
        setTimeout(function() {
            btn.text(originalText);
        }, 1000);
    });

    Reveal.on('ready', (event) => {
        // Move slide to current pos and order when it's ready
        apply_background_brightness();
        Reveal.slide(pos, order);
        change_slide();
        window.requestAnimationFrame(fit_reveal_wrapper);
    });

    Reveal.on('slidechanged', (event) => {
        if(slide_refreshed) {
            update_section_navigation();
            slide_refreshed = false;
            window.requestAnimationFrame(fit_reveal_wrapper);
            return true;
        }

        pos = event.indexh;
        order = event.indexv;
        update_section_navigation();
        change_slide();
        window.requestAnimationFrame(fit_reveal_wrapper);

        console.log("slide changed, emit changes to server", pos, order);
        socket.emit('control', {'type': 'pos', 'value': [pos, order], 'from': 'lead'});
    });
</script>
</body>
</html>
<!-- EXPERIMENTAL LEAD TEMPLATE END -->
