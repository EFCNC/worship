{% extends 'base.html' %}

{% block page_title %}Worship Chords{% endblock %}

{% block extra_css %}
<link href="/static/css/presentation.css" rel="stylesheet">
<style>
  span.chunk {
    position: relative;
  }

  span.chunk:before {
    font-size: 0.65em;
    content: attr(data-chord);
    position: absolute;
    top: -1.8em;
  }

  #sheet {
    font-size: 1.25em;
    line-height: 200%;
    width: 100%;
  }

    .bilingual-section {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        align-items: start;
    }

    .bilingual-section > div {
        min-width: 0;
    }

  /* Flexbox Layout Styles */
  #container {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 900px;
    margin: 0 auto;
  }

  #control_panel_container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

    #control_panel_container button[aria-pressed="true"] {
        background-color: #087f68;
    }

  /* Center the dropdown text */
  #transpose_select {
    text-align-last:center;
    min-width: 80px; 
  }
</style>
{% endblock %}

{% block content %}
<div id="container">
  <div id="song_title" style="margin-bottom: 10px;"></div>
  
  <div id="control_panel_container">
    <div id="transpose_select_container" style="display: flex; align-items: center; gap: 5px;"></div>
        <button id="sequence_toggle" type="button">Show Full Sequence</button>
        <button id="bilingual_toggle" type="button" aria-pressed="false">Bilingual</button>
  </div>
  
  <div style="text-align:center" id="sheet"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // --- DATA INITIALIZATION ---
    const sharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const flat = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

    const chords = {{ chords|safe }};
    let index = 0;
    let isFullSequence = false;
    let isBilingual = false;

    // --- FUNCTIONS ---
    function transposeChord(chord, diff) {
        if (diff === 0) return chord;
        
        let keys = sharp.indexOf(chord.split('/')[0]) >= 0 ? sharp : flat;
        
        return chord.split('/').map(part => {
            let root = part;
            let suffix = "";
            
            if (part[1] === 'b' || part[1] === '#') {
                root = part.substring(0, 2);
                suffix = part.substring(2);
            } else {
                root = part[0];
                suffix = part.substring(1);
            }

            let pos = keys.indexOf(root) + diff;
            
            if (pos >= keys.length) pos -= keys.length;
            if (pos < 0) pos += keys.length;
            
            return keys[pos] + suffix;
        }).join('/');
    }

    function load_sheet(ii, targetKey) {
        const data = chords[ii];
        
        // Determine if we should use sharps or flats based on the original key
        const activeKeys = sharp.indexOf(data.key) >= 0 ? sharp : flat;
        let currentKey = targetKey;

        // Determine the target key based on session memory, weekly transpose, or original key
        if (!currentKey) {
            if (data.saved_key_name) {
                // 1. Load user's session preference if it exists
                currentKey = data.saved_key_name;
            } else if (data.transpose_amount !== undefined && data.transpose_amount !== 0) {
                // 2. Apply weekly transpose amount
                let rootIdx = activeKeys.indexOf(data.key);
                let newIdx = (rootIdx + data.transpose_amount) % 12;
                if (newIdx < 0) newIdx += 12; // Handle negative transpositions
                currentKey = activeKeys[newIdx];
            } else {
                // 3. Fallback to original key
                currentKey = data.key;
            }
        }
        
        // Render key select dropdown with + / - buttons
        let html = '<button id="btn_transpose_down">-1</button>';
        html += '<select id="transpose_select">';
        for (let i = 0; i < activeKeys.length; i++) {
            let is_selected = (activeKeys[i] === currentKey) ? 'selected' : '';
            // Shortened to (Orig) to help with width, change to (Original) if preferred
            let label = (activeKeys[i] === data.key) ? activeKeys[i] + ' (Orig)' : activeKeys[i];
            
            html += '<option value="' + activeKeys[i] + '" ' + is_selected + '>' + label + '</option>';
        }
        html += '</select>';
        html += '<button id="btn_transpose_up">+1</button>';
        
        $('#transpose_select_container').html(html);

        // Calculate transposition difference based on the resolved currentKey
        let transpose = 0;
        if (currentKey) {
            transpose = activeKeys.indexOf(currentKey) - activeKeys.indexOf(data.key);
        }

        // Render chord sections in the song's configured sequence.
        const languageOrder = data.language_version_order || [];
        const primaryLanguage = languageOrder[0] || data.lang;
        const secondaryLanguage = languageOrder[1] || '';
        const primaryBlock = data.content.find(block => block.lang === primaryLanguage) || data.content[0];
        const secondaryBlock = data.content.find(block => block.lang === secondaryLanguage) ||
            data.content.find(block => block !== primaryBlock) || null;
        const sequenceItems = SongSequence.parseSequence(data.alt_sequence, primaryBlock, {
            fullSequence: isFullSequence
        });
        let sheetHtml = '';
        for (const item of sequenceItems) {
            const section = SongSequence.findSection(primaryBlock, item.name);
            const secondarySection = SongSequence.findSection(secondaryBlock, item.name);
            const chordLines = section && (section.lyrics_chord || section.lyrics);
            const primaryTextLines = section && (section.lyrics_text || section.lyrics);
            const secondaryTextLines = secondarySection && (secondarySection.lyrics_text || secondarySection.lyrics);
            let chordStr = '';
            if (Array.isArray(chordLines)) {
                chordStr = chordLines[item.index] !== undefined ? chordLines[item.index] : (chordLines[0] || '');
            } else if (typeof chordLines === 'string') {
                chordStr = chordLines;
            }
            if (!chordStr) continue;

            if (transpose !== 0) {
                chordStr = chordStr.replace(/(data-chord=")([^"]+)/g, (match, prefix, chord) => {
                    return prefix + transposeChord(chord, transpose);
                });
            }

            if (isBilingual) {
                const primaryText = Array.isArray(primaryTextLines) ? (primaryTextLines[item.index] || '') : (primaryTextLines || '');
                const secondaryText = Array.isArray(secondaryTextLines) ? (secondaryTextLines[item.index] || '') : (secondaryTextLines || '');
                const chordRows = chordStr.split(/\r?\n/);
                const primaryRows = primaryText.split(/\r?\n/);
                const secondaryRows = secondaryText.split(/\r?\n/);
                const rowCount = Math.max(chordRows.length, primaryRows.length, secondaryRows.length);
                let sectionHtml = `<div class="block"><strong>[${item.label}]</strong>`;
                for (let rowIndex = 0; rowIndex < rowCount; rowIndex++) {
                    const chordRow = chordRows[rowIndex] || primaryRows[rowIndex] || '';
                    const secondaryRow = secondaryRows[rowIndex] || '';
                    sectionHtml += `<div class="bilingual-section"><div>${chordRow}</div><div>${secondaryRow}</div></div>`;
                }
                sheetHtml += sectionHtml + '</div>';
            } else {
                chordStr = chordStr.replace(/\r?\n/g, '<br/>');
                sheetHtml += `<div class="block"><strong>[${item.label}]</strong><br/>${chordStr}</div>`;
            }
        }
        
        $('#sheet').empty().html(sheetHtml).show();
    }

    // Helper to safely change the song index from swipe/arrows
    function changeSong(direction) {
        let newIndex = parseInt(index) + direction;
        // Check array bounds
        if (newIndex >= 0 && newIndex < chords.length) {
            index = newIndex;
            $('#song_list').val(index); // Keep the dropdown UI synced
            load_sheet(index);
        }
    }

    // --- EVENT LISTENERS ---
    $(document).ready(function() {
        // Form select box with song title
        if (chords.length >= 1) {
            let songsHtml = '<select name="songs" id="song_list">';
            for (let s = 0; s < chords.length; s++) {
                songsHtml += `<option value="${s}">${chords[s].title}</option>`;
            }
            songsHtml += '</select>';
            
            $("#song_title").html(songsHtml);
            load_sheet(0);
        }

        $('#song_list').change(function() {
            index = this.value;
            load_sheet(index);
        });
    });

    $(document).on('change', '#transpose_select', function() {
        let selected_key = $(this).val();
        chords[index].saved_key_name = selected_key;
        load_sheet(index, selected_key);
    });

    $(document).on('click', '#sequence_toggle', function() {
        isFullSequence = !isFullSequence;
        $(this).text(isFullSequence ? 'Hide Repeated Sections' : 'Show Full Sequence');
        $(this).attr('aria-pressed', String(isFullSequence));
        load_sheet(index);
    });

    $(document).on('click', '#bilingual_toggle', function() {
        isBilingual = !isBilingual;
        $(this).attr('aria-pressed', String(isBilingual)).toggleClass('on', isBilingual);
        load_sheet(index);
    });

    // -1 Transpose Button
    $(document).on('click', '#btn_transpose_down', function() {
        let select = $('#transpose_select')[0];
        let newIndex = select.selectedIndex - 1;
        if (newIndex < 0) newIndex = select.options.length - 1; // Wrap to end
        
        let selected_key = select.options[newIndex].value;
        chords[index].saved_key_name = selected_key;
        load_sheet(index, selected_key);
    });

    // +1 Transpose Button
    $(document).on('click', '#btn_transpose_up', function() {
        let select = $('#transpose_select')[0];
        let newIndex = select.selectedIndex + 1;
        if (newIndex >= select.options.length) newIndex = 0; // Wrap to start
        
        let selected_key = select.options[newIndex].value;
        chords[index].saved_key_name = selected_key;
        load_sheet(index, selected_key);
    });

    // --- KEYBOARD & SWIPE NAVIGATION ---

    // Arrow keys
    $(document).keydown(function(e) {
        // Prevent arrows from changing songs if the user is interacting with a dropdown
        if (e.target.tagName.toLowerCase() === 'select') return;

        if (e.key === 'ArrowLeft') {
            changeSong(-1);
        } else if (e.key === 'ArrowRight') {
            changeSong(1);
        }
    });

    // // Touch Swiping
    // let touchStartX = 0;
    // let touchEndX = 0;
    // let touchStartY = 0;
    // let touchEndY = 0;

    // $(document).on('touchstart', function(e) {

    //     touchEndX = e.changedTouches[0].screenX;
    //     touchEndY = e.changedTouches[0].screenY;
    //     handleSwipe();
    // });

    //     let swipeThresholdY = 50; 

    //     // If the user scrolls vertically more than they swipe horizontally, ignore it
    //     if (Math.abs(touchEndY - touchStartY) > swipeThresholdY) return;

    //     if (touchEndX < touchStartX - swipeThresholdX) {

    //     } else if (touchEndX > touchStartX + swipeThresholdX) {
    //         // Swiped Right -> Move backward to previous song
    //         changeSong(-1);
    //     }
    // }
</script>
{% endblock %}
