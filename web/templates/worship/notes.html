{% extends 'base.html' %}

{% block page_title %}{{ w.date }} Worship Notes{% endblock %}

{% block extra_css %}
<meta name="viewport" content="width=device-width, initial-scale=1" charset="utf-8">
<link rel="stylesheet" href="/static/css/worship-shared.css">
<style>
.reference {
    padding: 0.5em;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
}

span.chunk {
    position:relative;
}

span.chunk:before {
    font-size: 0.65em;
    content:attr(data-chord);
    position:absolute;
    top:-2em;
}

.song_chord {
    line-height: 200%;
}

.song_container {
    display: flex;
    width: 100%;
    align-items: center;
}

.song_block {
    text-align: center;
    background-color: #e0e0e0;
    width: 50%;
    position: relative;
    color: #000;
}

.song_block > span {
    position: absolute;
    top: 5px;
    left: 5px;
}

.notes {
    text-align: center;
    flex: 1;

    min-width: 0; 
    overflow-wrap: break-word;
    word-break: break-word;
}

.info {
    border: 2px solid #856088;
    color: #000;
    border-radius: 5px;
}

.songs {
    border: 2px solid #556b2f;
    color: #000;
    border-radius: 5px;
    padding: 0px 10px 10px 10px;
}

/* Toggle buttons */
.view  { --btn-color: #04AA6D; }
.chord { --btn-color: #008CBA; }
.bi    { --btn-color: #555555; }
.video { --btn-color: #800000; }

.toggle-btn {
    background-color: white;
    color: black;
    border: 2px solid var(--btn-color);
}

.toggle-btn.on,
.toggle-btn:hover {
    background-color: var(--btn-color);
    color: white;
}

/* Video Grid */
.video-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    margin-bottom: 30px;
}

.video-container {
    flex: 1 1 400px; 
    max-width: 640px; 
    aspect-ratio: 16 / 9;
}

.video-container iframe {
    width: 100%;
    height: 100%;
}

h3 {
    margin-top: 0;
}

@media (max-width: 768px) {
    .song_container {
        flex-direction: column;
    }
    
    .song_block, .notes {
        width: 100%;
        margin-bottom: 10px;
    }
}
</style>
{% endblock %}

{% block content %}

    <div id="summary_container" class="app-card">
        <!-- Dynamically populated by get_sermon() -->
    </div>
    
    <!-- Container of worship songs -->
    <div class="action_btn_container">
        <button class="toggle-btn view" onclick="loadTab('view')">View</button>
        <button class="toggle-btn chord" onclick="loadTab('chord')">Chord</button>
        <button class="toggle-btn bi" onclick="loadTab('bi')">Bilingual</button>
        <button class="toggle-btn video" onclick="loadTab('video')">Youtube</button>
        <a href="{{ url_for('get_weekly_chords', id=id) }}">
            <button class="toggle-btn view">All Chords</button>
        </a>
        <a href="{{ url_for('get_weekly_sheets', id=id) }}">
            <button class="toggle-btn view">All Sheets</button>
        </a>

        
    </div>

    <div id="worship">
        <!-- Worship songs will be dynamically loaded here through the script -->
    </div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/config.js"></script>
<script src="/static/js/bible.js"></script>
<script>
    // --- DATA INITIALIZATION ---
    const sharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const flat = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

    const worshipData = {{ songs|tojson|safe }};
    const worshipInfo = {{ w|tojson|safe }};
    const initialTab = '{{ tab|safe }}' || 'view';
    const song_id = worshipData.map(o=> o.id);
    let isFullSequence = false;

    // --- FUNCTIONS ---

    /**
    * Builds and injects the Sermon Card HTML
    */
    function get_sermon() {
        function buildBibleLinks(bibleText) {
            var bible = (bibleText || '').replace(/(、|;)/g, '，').split('，');
            var b = '';
            for (var i=0; i<bible.length; i++) {
                var verse = bible[i].trim();
                if (verse !== "") {
                    var escapedVerse = verse.replace(/'/g, "\\'").replace(/"/g, '\\"');
                    b += ' <a class="bible-link" href="javascript:void(0)" onclick="get_bible(show_verse, \'' + escapedVerse + '\'); return false;">' + verse + '</a>';
                }
            }
            return b;
        }

        var sermonVariants = worshipInfo.sermons || {};
        var sermonLangs = [
            { key: 'zh', label: '中文', shortLabel: '中' },
            { key: 'zh-TW', label: '台語', shortLabel: '台' },
            { key: 'en', label: 'English', shortLabel: 'EN' }
        ];

        var titleHtml = "<h3>{{ w.date }} 敬拜筆記 (Worship Notes)</h3>";

        var cardHtml = sermonLangs.filter(function(item) {
            var sermon = sermonVariants[item.key] || {};
            return sermon.title || sermon.speaker || sermon.bible || sermon.outline;
        }).map(function(item) {
            var sermon = sermonVariants[item.key] || {};
            var bibleText = buildBibleLinks(sermon.bible || '');
            return `
                <div class="sermon-header">
                    <h4 class="sermon-title"><strong>${item.label}:</strong> ${sermon.title || ''}</h4>
                    <span class="sermon-speaker">By: ${sermon.speaker || ''}</span>
                </div>
                <div class="sermon-bible"><strong>Scripture Reference:</strong> ${bibleText}</div>
                <div class="sermon-outline"><strong>Sermon Outline:</strong><br/>${sermon.outline || ''}</div>
            `;
        }).join('');

        var teamHtml = '';
        if (worshipInfo.content && worshipInfo.content.length > 0) {
            var teamRows = worshipInfo.content.map(function(team) {
                return `<strong>${team.role}:</strong> ${team.user_name}`;
            }).join('<br/>');

            teamHtml = `
                <div class="card-row" style="border-top: 1px solid #eee; padding-top: 12px;">
                    <p>${teamRows}</p>
                </div>
            `;
        }

        var notesHtml = '';
        if (worshipInfo.notes) {
            notesHtml = `
                <div class="card-row" style="border-top: 1px solid #eee; padding-top: 12px;">
                    <p>
                        <strong>Worship Leader's Notes:</strong><br/>
                        ${worshipInfo.notes.replace(/\n/g, '<br/>')}
                    </p>
                </div>
            `;
        }

        $('#summary_container').html(titleHtml + cardHtml + teamHtml + notesHtml);
    }

    /**
    * Transposes a single chord string (e.g., "G/B") by a specific number of steps (diff).
    */
    function transposeChord(chord, diff) {
        if (diff === 0) return chord;
        
        // Determine if we should use sharps or flats based on the input chord
        let keys = sharp.indexOf(chord.split('/')[0]) >= 0 ? sharp : flat;
        
        return chord.split('/').map(part => {
            let root = part;
            let suffix = "";
            
            // Handle chords like C#m or Bb7
            if (part[1] === 'b' || part[1] === '#') {
                root = part.substring(0, 2);
                suffix = part.substring(2);
            } else {
                root = part[0];
                suffix = part.substring(1);
            }

            let pos = keys.indexOf(root) + diff;
            
            // Wrap around logic
            if (pos >= keys.length) pos -= keys.length;
            if (pos < 0) pos += keys.length;
            
            return keys[pos] + suffix;
        }).join('/');
    }

    /** 
    * Generate Language Tag Bubbles
    */
    function getLangTag(lang) {
        const tags = {
            'en': {class:"lang_en", title: "English", label: "en"},
            'zh': {class:"lang_zh", title: "Chinese", label: "zh"},
            'zh-TW': {class:"lang_zhTW", title: "Taiwanese", label: "tw"},
            'zh-pingyin': {class:"lang_zhpingyin", title: "Zh PingYin", label: "zh"}            
        }
        const config = tags[lang] || { class: 'others', label: 'na', title: 'N/A' };
        return lang ? `<span class="${config.class}" title="${config.title}">${config.label}</span>` : "";
    }
    
    const SECTION_PREFIX_MAP = {
        'v': 'verse', 'verse': 'verse',
        'c': 'chorus', 'chorus': 'chorus',
        'b': 'bridge', 'bridge': 'bridge',
        'pre': 'prechorus', 'prechorus': 'prechorus',
        'post': 'postchorus', 'postchorus': 'postchorus',
        'tag': 'tag',
        'vamp': 'vamp',
        'in': 'intro', 'intro': 'intro',
        'out': 'outro', 'outro': 'outro',
        'inst': 'interlude', 'interlude': 'interlude', 'instrumental': 'instrumental'
    };

    function getSectionDisplayLabel(rawToken, canonicalName, index, totalCount) {
        const defaultLabels = {
            'verse': 'Verse',
            'chorus': 'Chorus',
            'bridge': 'Bridge',
            'prechorus': 'Pre-Chorus',
            'postchorus': 'Post-Chorus',
            'tag': 'Tag',
            'vamp': 'Vamp',
            'intro': 'Intro',
            'outro': 'Outro',
            'interlude': 'Interlude',
            'instrumental': 'Instrumental'
        };
        let base = defaultLabels[canonicalName] || canonicalName;
        if (totalCount > 1 || rawToken.match(/\d+$/)) {
            return `${base} ${index + 1}`;
        }
        return base;
    }

// --- SEQUENCE PARSING & DEDUPLICATION ---
    
    /**
     * Parses a song's sequence string into ordered section items.
     * By default, it deduplicates repeating sections while preserving their first occurrence.
     */
    function parseSequence(rawSequence, primaryBlock, options = {}) {
        const { fullSequence = false } = options;
        let sequenceItems = [];
        let seenKeys = new Set();

        const findSection = (block, secName) => {
            if (!block || !Array.isArray(block.lyrics)) return null;
            let target = secName.toLowerCase().replace('-', '');
            return block.lyrics.find(s => s.name && s.name.toLowerCase().replace('-', '') === target);
        };

        let trimmedSeq = (rawSequence || '').trim();

        if (trimmedSeq) {
            let tokens = trimmedSeq.split(',').map(s => s.trim()).filter(Boolean);

            for (let token of tokens) {
                let match = token.match(/^([a-zA-Z\-]+)(\d*)$/);
                let canonicalName = token;
                let index = 0;

                if (match) {
                    let prefix = match[1].toLowerCase();
                    let numStr = match[2];
                    index = numStr ? Math.max(0, parseInt(numStr, 10) - 1) : 0;
                    canonicalName = SECTION_PREFIX_MAP[prefix] || prefix;
                }

                // Deduplication key (e.g. "chorus_0")
                let itemKey = `${canonicalName.toLowerCase()}_${index}`;
                if (!fullSequence && seenKeys.has(itemKey)) {
                    continue; // Skip repetitions by default
                }
                seenKeys.add(itemKey);

                let secObj = findSection(primaryBlock, canonicalName);
                let textArr = secObj ? (secObj.lyrics_text || secObj.lyrics) : null;
                let totalCount = Array.isArray(textArr) ? textArr.length : 1;

                let label = getSectionDisplayLabel(token, canonicalName, index, totalCount);
                sequenceItems.push({ name: canonicalName, index: index, label: label });
            }
        } else {
            // Fallback: render each section in order if no sequence was specified
            if (primaryBlock && Array.isArray(primaryBlock.lyrics)) {
                for (let sec of primaryBlock.lyrics) {
                    let textArr = sec.lyrics_text || sec.lyrics || [];
                    let count = Array.isArray(textArr) ? textArr.length : 1;
                    for (let i = 0; i < count; i++) {
                        let label = getSectionDisplayLabel(sec.name, sec.name, i, count);
                        sequenceItems.push({ name: sec.name, index: i, label: label });
                    }
                }
            }
        }
        return sequenceItems;
    }

    // --- RENDER CONTENT ---

    /**
    * Renders the song content utilizing the language_version_order array
    */
    function renderSongContent(song, mode, options = {}) {
        if (!song || !Array.isArray(song.content) || song.content.length === 0) return '';

        // Safely extract languages from the new language_version_order array
        let langOrders = song.language_version_order || [];
        let lang1 = langOrders.length > 0 ? langOrders[0] : (song.lang || '');
        let lang2 = langOrders.length > 1 ? langOrders[1] : (song.lang_2 || '');

        let primaryBlock = song.content.find(c => c.lang === lang1) || song.content[0];
        let secondaryBlock = song.content.find(c => c.lang === lang2) || (song.content.length > 1 ? song.content[1] : null);

        const findSection = (block, secName) => {
            if (!block || !Array.isArray(block.lyrics)) return null;
            let target = secName.toLowerCase().replace('-', '');
            return block.lyrics.find(s => s.name && s.name.toLowerCase().replace('-', '') === target);
        };

        const getSectionData = (block, secName, index, field) => {
            let sec = findSection(block, secName);
            if (!sec) return '';
            let arr = sec[field] || sec.lyrics_text || sec.lyrics || [];
            if (Array.isArray(arr)) {
                return arr[index] !== undefined ? arr[index] : (arr[0] || '');
            }
            if (typeof arr === 'string') return arr;
            return '';
        };

        // Parse sequence, deduplicating repetitions unless fullSequence is true
        let sequenceItems = parseSequence(song.alt_sequence, primaryBlock, options);

        let contentHtml = '';
        for (let item of sequenceItems) {
            let text1 = '', chords = '', text2 = '';

            switch(mode) {
                case 'view':
                    text1 = getSectionData(primaryBlock, item.name, item.index, 'lyrics_text') || getSectionData(primaryBlock, item.name, item.index, 'lyrics');
                    if (!text1) continue;

                    contentHtml += `<div><span><strong>[${item.label}]</strong></span>`;
                    contentHtml += `<div class="song">${text1.replace(/\n/g, '<br/>')}</div>`;
                    contentHtml += `</div><br/>`;
                    break;

                case 'chord':
                    chords = getSectionData(primaryBlock, item.name, item.index, 'lyrics_chord') || getSectionData(primaryBlock, item.name, item.index, 'lyrics');
                    if (!chords) continue;

                    if (song.transpose && song.transpose !== '0') {
                        let key_change = parseInt(song.transpose, 10);
                        chords = chords.replace(/(data-chord=")([^"]+)/g, (match, g1, g2) => {
                            return g1 + transposeChord(g2, key_change);
                        });
                    }

                    contentHtml += `<div><span><strong>[${item.label}]</strong></span>`;
                    contentHtml += `<div class="song_chord">${chords.replace(/\n/g, '<br/>')}</div>`;
                    contentHtml += `</div><br/>`;
                    break;

                case 'bi':
                    text1 = getSectionData(primaryBlock, item.name, item.index, 'lyrics_text') || getSectionData(primaryBlock, item.name, item.index, 'lyrics');
                    text2 = secondaryBlock ? (getSectionData(secondaryBlock, item.name, item.index, 'lyrics_text') || getSectionData(secondaryBlock, item.name, item.index, 'lyrics')) : '';

                    if (!text1 && !text2) continue;

                    contentHtml += `<div><span><strong>[${item.label}]</strong></span>`;
                    contentHtml += `<div class="song">
                        <div class="origin">${text1.replace(/\n/g, '<br/>')}</div>
                        ${text2 ? `<div class="region">${text2.replace(/\n/g, '<br/>')}</div>` : ''}
                    </div>`;
                    contentHtml += `</div><br/>`;
                    break;
            }
        }
        return contentHtml;
    }

    /**
    * Generate Dropdowns for Media Links
    */
    function getMediaLinksHtml(item) {
        let html = '';

        // Sheet Music Links (Score)
        if (item.score && item.score.length > 0) {
            if (item.score.length === 1) {
                html += `<a href="${item.score[0]}" target="_blank"><i style="font-size:24px" class="fa" title="Sheet Music">&#xf0f6;</i></a>`;
            } else {
                html += `<div class="media-dropdown">
                    <span class="media-dropbtn"><i class="fa" style="font-size:24px" title="Sheet Music">&#xf0f6;</i><span class="badge">${item.score.length}</span></span>
                    <div class="media-dropdown-content">`;
                item.score.forEach((link, idx) => {
                    html += `<a href="${link}" target="_blank">Sheet Music ${idx + 1}</a>`;
                });
                html += `</div></div>`;
            }
        }

        // ABC Interactive Sheets
        if (item.abc && item.abc.length > 0) {
            html += `<a href="/worship/sheets/${item.id}" target="_blank"><i style="font-size:24px" class="fa" title="Interactive Sheet Music">&#xf1c7;</i></a>`;
        }

        // Video Links
        if (item.video && item.video.length > 0) {
            if (item.video.length === 1) {
                html += `<a href="${item.video[0]}" target="_blank"><i class="fa fa-play-circle" style="font-size:24px" title="Youtube Video"></i></a>`;
            } else {
                html += `<div class="media-dropdown">
                    <span class="media-dropbtn"><i class="fa fa-play-circle" style="font-size:24px" title="Youtube Videos"></i><span class="badge">${item.video.length}</span></span>
                    <div class="media-dropdown-content">`;
                item.video.forEach((link, idx) => {
                    html += `<a href="${link}" target="_blank">Video ${idx + 1}</a>`;
                });
                html += `</div></div>`;
            }
        }
        
        // Return wrapped inside our flexbox container if there are links
        return html ? `<span class="media-icons-wrapper">${html}</span>` : '';
    }

    /**
    * Loads the tab based on the button that was clicked (view, chord, bi, video) and updates the content accordingly.
    */
    function loadTab(mode) {
        const activeBtn = document.querySelector(`.toggle-btn.${mode}`);

        // Toggle full sequence if clicking the currently active tab (excluding video)
        if (activeBtn && activeBtn.classList.contains('on') && mode !== 'video') {
            isFullSequence = !isFullSequence;
        } else {
            // Reset to default (deduplicated) when switching to a new tab
            isFullSequence = false;
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('on'));
            if (activeBtn) activeBtn.classList.add('on');
        }

        let finalHtml = '';

        for (item of worshipData) {
            if (item.type === 'info') {
                finalHtml += `<div class="info">${item.notes.replace(/\n/g, '<br/>')}</div>`;
                continue;
            }

            if (mode === 'video') {
                if (item.video && item.video.length > 0) {
                    finalHtml += `<div style="text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 1.2em;">${item.title}</div>`;
                    
                    finalHtml += `<div class="video-grid">`;
                    item.video.forEach(v => {
                        let videoUrl = v.replace('youtu.be/', 'www.youtube.com/embed/').replace('watch?v=', 'embed/');
                        finalHtml += `<div class="video-container"><iframe src="${videoUrl}" frameborder="0" allowfullscreen></iframe></div>`;
                    });
                    finalHtml += `</div>`;
                }
            } else {
                let langOrders = item.language_version_order || [];
                let lang1 = langOrders.length > 0 ? langOrders[0] : (item.lang || '');
                let lang2 = langOrders.length > 1 ? langOrders[1] : (item.lang_2 || '');

                let currentKey = transposeChord(item.song_key, parseInt(item.transpose || 0));
                // Visually indicate when the full sequence is active
                let sequenceDisplay = isFullSequence ? `[${item.alt_sequence || ''}] (Full)` : `[${item.alt_sequence || ''}]`;

                let header = `
                    <div class="songs">
                        <div class="reference">
                            ${item.title} (${currentKey})
                            ${getLangTag(lang1)} ${getLangTag(lang2)} 
                            ${sequenceDisplay}
                            ${getMediaLinksHtml(item)}
                        </div>
                        <div class="song_container">
                            <div class="song_block">${renderSongContent(item, mode, { fullSequence: isFullSequence })}</div>
                            <div class="notes">${(item.notes || '').replace(/\n/g, '<br/>')}</div>
                        </div>
                    </div><br/>`;
                finalHtml += header;
            }
        }
        document.getElementById('worship').innerHTML = finalHtml;
    }

    // console.log(tab)
    // if(tab == '') {
    //     load('view');
    // }
    // else {
    //     load(tab);
    // }

    /**
    * Thing that runs the thing on startup
    */
    window.onload = () => {
        if (worshipInfo && worshipInfo.date) {
            document.title = `${worshipInfo.date} Worship Notes - Worship Manager`;
        }

        get_sermon();

        // Load initial view
        loadTab(initialTab);
    };
</script>
{% endblock %}
